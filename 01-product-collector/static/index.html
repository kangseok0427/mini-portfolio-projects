<!DOCTYPE html>
<html lang="ko">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   상품정보 수집기
  </title>
  <link href="/static/style.css" rel="stylesheet"/>
 </head>
 <body>
  <header>
   <strong>
    WORKFLOW / 상품 수집기
   </strong>
   <span>
    Python · 데이터 수집 · Excel 자동 생성
   </span>
  </header>
  <main>
   <span class="badge">
    반복 업무를 한 번의 실행으로
   </span>
   <h1>
    상품정보, 복사 대신 수집하세요.
   </h1>
   <p class="muted">
    상품명·가격·링크를 정리하고 중복을 제거해 Excel로 저장합니다.
   </p>
   <section class="card">
    <div class="grid">
     <div>
      <label for="source">
       수집 모드
      </label>
      <select id="source">
       <option value="demo">
        샘플 데모 — 네트워크 미사용
       </option>
       <option value="web">
        실제 공개 웹페이지
       </option>
      </select>
     </div>
     <div>
      <label for="query">
       검색어 또는 URL
      </label>
      <input id="query" placeholder="예: 무선 / https://books.toscrape.com/"/>
     </div>
     <div>
      <label for="pages">
       최대 페이지
      </label>
      <select id="pages">
       <option>
        1
       </option>
       <option selected="">
        3
       </option>
       <option>
        5
       </option>
      </select>
     </div>
    </div>
    <p>
     <small>
      검색어는 수집한 상품명 안에서 찾습니다. 공개 웹 기본 대상은 수집 실습용 Books to Scrape입니다.
     </small>
    </p>
    <button id="start">
     수집 시작 → Excel 만들기
    </button>
    <p id="status" role="status">
     실행할 준비가 되었습니다.
    </p>
    <progress id="progress" max="100" value="0">
    </progress>
   </section>
   <section class="hidden" id="results">
    <div class="metrics">
     <div class="metric">
      저장 상품
      <strong id="count">
       0
      </strong>
      건
     </div>
     <div class="metric">
      제거한 중복
      <strong id="duplicates">
       0
      </strong>
      건
     </div>
     <div class="metric">
      건너뛴 오류
      <strong id="errors">
       0
      </strong>
      건
     </div>
    </div>
    <div class="card">
     <div class="row">
      <h2>
       수집 결과
      </h2>
      <a class="button" id="download">
       Excel 다운로드
      </a>
     </div>
     <p class="muted" id="savepath">
     </p>
     <div class="scroll">
      <table>
       <thead>
        <tr>
         <th>
          상품명
         </th>
         <th>
          가격
         </th>
         <th>
          통화
         </th>
         <th>
          재고
         </th>
         <th>
          링크
         </th>
        </tr>
       </thead>
       <tbody id="rows">
       </tbody>
      </table>
     </div>
     <details>
      <summary>
       처리 상세
      </summary>
      <p class="error" id="details">
      </p>
     </details>
    </div>
   </section>
  </main>
  <script>
   const $=id=>document.getElementById(id);let timer;
$('start').onclick=async()=>{clearTimeout(timer);$('start').disabled=true;$('results').classList.add('hidden');try{const r=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:$('query').value,source:$('source').value,max_pages:Number($('pages').value)})});const data=await r.json();if(!r.ok)throw Error(data.detail);poll(data.id)}catch(e){$('status').textContent=e.message;$('start').disabled=false}};
async function poll(id){try{const r=await fetch('/api/jobs/'+id);const j=await r.json();if(!r.ok)throw Error(j.detail);$('status').textContent=j.message;$('progress').value=j.progress;if(j.status==='running'){timer=setTimeout(()=>poll(id),250);return}$('start').disabled=false;if(j.status!=='done')return;$('results').classList.remove('hidden');$('count').textContent=j.products.length;$('duplicates').textContent=j.duplicates;$('errors').textContent=j.errors.length;$('details').textContent=j.errors.join('\n')||'오류 없음';$('savepath').textContent='저장 위치: '+j.save_path;$('download').href=j.download;$('rows').replaceChildren();for(const p of j.products){const tr=document.createElement('tr');for(const value of [p.name,p.price.toLocaleString(),p.currency,p.availability]){const td=document.createElement('td');td.textContent=value;tr.append(td)}const td=document.createElement('td'),a=document.createElement('a');a.textContent='상품 보기';if(/^https?:\/\//.test(p.url))a.href=p.url;a.target='_blank';a.rel='noopener';td.append(a);tr.append(td);$('rows').append(tr)}}catch(e){$('status').textContent=e.message;$('start').disabled=false}}
  </script>
 </body>
</html>
